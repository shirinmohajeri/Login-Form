<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <title>Neumorphism Login</title>
</head>

<body>

  <div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="login-box text-center p-5">

      <!-- Logo -->
      <div class="logo mx-auto mb-4">
        <span>></span>
      </div>

      <!-- Title -->
      <h2 class="fw-bold">Welcome</h2>
      <p class="text-muted mb-5">User Login</p>

      <!-- Form -->
      <form>

        <!-- Username -->
        <div class="input-box d-flex align-items-center mb-4 px-3">
          <span class="me-2">👤</span>

          <input 
            type="text"
            class="form-control border-0 bg-transparent shadow-none"
            placeholder="username">
        </div>

        <!-- Password -->
        <div class="input-box d-flex align-items-center mb-4 px-3">
          <span class="me-2">🔒</span>

          <input 
            type="password"
            class="form-control border-0 bg-transparent shadow-none"
            placeholder="password">
        </div>

        <!-- Button -->
        <button class="btn login-btn w-100 mb-4">
          Login
        </button>

        <!-- Links -->
        <div class="small">
          <a href="#" class="text-decoration-none text-dark fw-bold">
            Forgot password?
          </a>

          <span class="mx-1">or</span>

          <a href="#" class="text-decoration-none text-dark fw-bold">
            Sign Up
          </a>
        </div>

      </form>

    </div>

  </div>

</body>
</html>
